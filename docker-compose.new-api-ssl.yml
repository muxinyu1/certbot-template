services:
  new-api:
    image: calciumion/new-api:latest
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:${POSTGRES_PASSWORD:-123456}@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:-123456}@redis:6379
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=new-api-node-1
    depends_on:
      - redis
      - postgres
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-123456}"]
    networks:
      - app-net

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app-net

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-ssl-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./nginx/templates/new-api-site.conf.template:/etc/nginx/templates/site.conf.template:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      - ./scripts/nginx-entrypoint.sh:/scripts/nginx-entrypoint.sh:ro
    depends_on:
      - new-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["/bin/sh", "/scripts/nginx-entrypoint.sh"]
    networks:
      - app-net

  certbot:
    image: certbot/certbot:v2.11.0
    container_name: certbot-renew
    restart: unless-stopped
    depends_on:
      - nginx
    env_file:
      - .env
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      - ./scripts/certbot-loop.sh:/scripts/certbot-loop.sh:ro
    entrypoint: ["/bin/sh", "/scripts/certbot-loop.sh"]
    networks:
      - app-net

volumes:
  pg_data:
    external: true
    name: new-api_pg_data

networks:
  app-net:
    driver: bridge